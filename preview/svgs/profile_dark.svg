<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" role="img" aria-labelledby="title desc"><title id="title">JOEYCH profile and GitHub statistics</title><desc id="desc">Embedded systems profile and GitHub REST statistics for original non-fork repositories.</desc><defs><linearGradient id="divider" x1="0" x2="0" y2="1"><stop stop-color="#39d353" stop-opacity=".6"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient></defs><rect width="900" height="292" fill="#0a0c10"/><rect x="456" width="444" height="292" fill="#0d1015" opacity=".65"/><path d="M0 .5H900M0 291.5H900" stroke="#30363d" stroke-width="1"/><text x="24" y="16" font-family="'Courier New', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#7d8590">// ABOUT</text><path d="M24 24H436" stroke="#30363d" stroke-width=".5"/><text x="24" y="44" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#e6edf3">Practical embedded systems engineering.</text><text x="24" y="64" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#8b949e">From MCU firmware and flight control</text><text x="24" y="84" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#8b949e">to hardware schematics and real devices.</text><text x="24" y="124" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#8b949e">Working with C/C++, Python, and STM32,</text><text x="24" y="144" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#8b949e">Raspberry Pi Pico, PX4, and PCB design,</text><text x="24" y="164" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#8b949e">plus AI and computer vision.</text><path d="M24 198H436" stroke="#21262d" stroke-width=".5"/><circle cx="29" cy="213" r="2.5" fill="#39d353" opacity=".75"/><text x="40" y="218" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#7d8590">Location · SuZhou · UTC+8</text><circle cx="29" cy="235" r="2.5" fill="#39d353" opacity=".75"/><text x="40" y="240" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#7d8590">Original project · eFlyDrone-Boards</text><rect x="456" y="24" width="1" height="244" fill="url(#divider)"/><text x="480" y="16" font-family="'Courier New', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#7d8590">// GITHUB REST STATS</text><path d="M480 24H876" stroke="#30363d" stroke-width=".5"/><circle cx="484" cy="48" r="3" fill="#39d353"/><text x="496" y="52" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#8b949e">Original repos</text><text x="876" y="52" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="700" fill="#39d353">5</text><circle cx="484" cy="94" r="3" fill="#39d353"/><text x="496" y="98" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#8b949e">Stars earned</text><text x="876" y="98" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="700" fill="#39d353">0</text><path d="M480 122H876" stroke="#30363d" stroke-width=".5"/><text x="480" y="145" font-family="'Courier New', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#7d8590">TOP LANGUAGES</text><text x="480" y="166" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8b949e">JavaScript · TypeScript</text><rect x="480" y="188" width="152" height="20" rx="10" fill="#0d2114" stroke="#30363d" stroke-width=".5"/><text x="556" y="201.5" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="9.5" font-weight="700" fill="#39d353">UTC 2026</text><text x="480" y="235" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#7d8590">Owner repos only; forks excluded</text><rect width="3" height="292" fill="#39d353"