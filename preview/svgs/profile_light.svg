<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" role="img" aria-labelledby="title desc"><title id="title">JOEYCH profile and GitHub statistics</title><desc id="desc">Embedded systems profile and GitHub REST statistics for original non-fork repositories.</desc><defs><linearGradient id="divider" x1="0" x2="0" y2="1"><stop stop-color="#16a34a" stop-opacity=".6"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></linearGradient></defs><rect width="900" height="292" fill="#fcfbf9"/><rect x="456" width="444" height="292" fill="#f0ead6" opacity=".65"/><path d="M0 .5H900M0 291.5H900" stroke="#e5e1d8" stroke-width="1"/><text x="24" y="16" font-family="'Courier New', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#59636e">// ABOUT</text><path d="M24 24H436" stroke="#e5e1d8" stroke-width=".5"/><text x="24" y="44" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#1a1a1a">Practical embedded systems engineering.</text><text x="24" y="64" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#57606a">From MCU firmware and flight control</text><text x="24" y="84" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#57606a">to hardware schematics and real devices.</text><text x="24" y="124" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#57606a">Working with C/C++, Python, and STM32,</text><text x="24" y="144" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#57606a">Raspberry Pi Pico, PX4, and PCB design,</text><text x="24" y="164" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="400" fill="#57606a">plus AI and computer vision.</text><path d="M24 198H436" stroke="#d4cdbc" stroke-width=".5"/><circle cx="29" cy="213" r="2.5" fill="#16a34a" opacity=".75"/><text x="40" y="218" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#59636e">Location · SuZhou · UTC+8</text><circle cx="29" cy="235" r="2.5" fill="#16a34a" opacity=".75"/><text x="40" y="240" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#59636e">Original project · eFlyDrone-Boards</text><rect x="456" y="24" width="1" height="244" fill="url(#divider)"/><text x="480" y="16" font-family="'Courier New', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#59636e">// GITHUB REST STATS</text><path d="M480 24H876" stroke="#e5e1d8" stroke-width=".5"/><circle cx="484" cy="48" r="3" fill="#16a34a"/><text x="496" y="52" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#57606a">Original repos</text><text x="876" y="52" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="700" fill="#137333">5</text><circle cx="484" cy="94" r="3" fill="#16a34a"/><text x="496" y="98" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#57606a">Stars earned</text><text x="876" y="98" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="20" font-weight="700" fill="#137333">0</text><path d="M480 122H876" stroke="#e5e1d8" stroke-width=".5"/><text x="480" y="145" font-family="'Courier New', Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#59636e">TOP LANGUAGES</text><text x="480" y="166" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#57606a">JavaScript · TypeScript</text><rect x="480" y="188" width="152" height="20" rx="10" fill="#dcfce7" stroke="#e5e1d8" stroke-width=".5"/><text x="556" y="201.5" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="9.5" font-weight="700" fill="#137333">UTC 2026</text><text x="480" y="235" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#59636e">Owner repos only; forks excluded</text><rect width="3" height="292" fill="#16a34a"