<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img" aria-labelledby="title desc"><title id="title">JOEYCH mobile profile and GitHub statistics</title><desc id="desc">Mobile-friendly embedded systems profile and GitHub REST statistics for original non-fork repositories.</desc><rect width="360" height="500" fill="#fcfbf9"/><path d="M0 .5H360M0 499.5H360" stroke="#e5e1d8" stroke-width="1"/><text x="20" y="24" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#59636e">// ABOUT</text><path d="M20 34H340" stroke="#e5e1d8" stroke-width=".5"/><text x="20" y="62" font-family="'Courier New', Consolas, monospace" font-size="15" font-weight="700" fill="#1a1a1a">Embedded systems engineering.</text><text x="20" y="91" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#57606a">From MCU firmware to flight control,</text><text x="20" y="114" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#57606a">verified systems on real hardware.</text><text x="20" y="151" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#57606a">C/C++ · Python · STM32 · PX4</text><text x="20" y="174" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#57606a">Raspberry Pi Pico · PCB · AI / CV</text><path d="M20 201H340" stroke="#d4cdbc" stroke-width=".5"/><circle cx="25" cy="221" r="3" fill="#16a34a"/><text x="38" y="226" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#59636e">Location · SuZhou · UTC+8</text><circle cx="25" cy="247" r="3" fill="#16a34a"/><text x="38" y="252" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#59636e">Original project · eFlyDrone-Boards</text><rect x="12" y="274" width="336" height="208" rx="6" fill="#f0ead6" opacity=".72"/><text x="20" y="294" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#59636e">// GITHUB REST STATS</text><path d="M20 303H340" stroke="#e5e1d8" stroke-width=".5"/><circle cx="24" cy="317" r="3.5" fill="#7a4d00"/><text x="38" y="322" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#57606a">Original repos</text><text x="336" y="322" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#7a4d00">Unavailable</text><circle cx="24" cy="361" r="3.5" fill="#7a4d00"/><text x="38" y="366" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#57606a">Stars earned</text><text x="336" y="366" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" fill="#7a4d00">Unavailable</text><path d="M20 405H340" stroke="#e5e1d8" stroke-width=".5"/><text x="20" y="427" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#59636e">TOP LANGUAGES</text><text x="20" y="450" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#57606a">Language data unavailable</text><rect x="242" y="419" width="98" height="22" rx="11" fill="#dcfce7" stroke="#e5e1d8" stroke-width=".5"/><text x="291" y="434" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" fill="#137333">UTC 2026</text><text x="20" y="477" font-family="'Courier New', Consolas, monospace" font-size="10.5" fill="#7a4d00">Static preview omits live GitHub data</text><rect width="3" height="500" fill="#16a34a" opacity=".7"/></svg>